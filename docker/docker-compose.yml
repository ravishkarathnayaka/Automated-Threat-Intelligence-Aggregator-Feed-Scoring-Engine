version: "3.8"

services:
  # =========================================================================
  # Database Layer (PostgreSQL 16)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cti_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cti_secure_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-cti_scoring_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cti_admin} -d ${POSTGRES_DB:-cti_scoring_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Caching Layer (Redis 7)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: cti_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================================================
  # FastAPI Core Scoring Engine
  # =========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cti_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cti_admin}:${POSTGRES_PASSWORD:-cti_secure_pass123}@postgres:5432/${POSTGRES_DB:-cti_scoring_db}
      - REDIS_URL=redis://redis:6379/0
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # Ingestion & Confidence Scoring Background Worker
  # =========================================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cti_worker
    restart: unless-stopped
    command: ["python", "-m", "cti_core.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cti_admin}:${POSTGRES_PASSWORD:-cti_secure_pass123}@postgres:5432/${POSTGRES_DB:-cti_scoring_db}
      - REDIS_URL=redis://redis:6379/0
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-3600}

volumes:
  postgres_data:
  redis_data:
